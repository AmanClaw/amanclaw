<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TENANT_NAME}} — AmanClaw Chat</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f3f4f6;
    --bg-input: #ffffff;
    --text: #111827;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --bot-bg: #f3f4f6;
    --bot-text: #111827;
    --accent: #2563eb;
    --shadow: rgba(0,0,0,0.08);
    --code-bg: #f1f5f9;
    --status-ok: #22c55e;
    --status-err: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --bg-input: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --user-bg: #3b82f6;
      --user-text: #ffffff;
      --bot-bg: #1e293b;
      --bot-text: #f1f5f9;
      --accent: #3b82f6;
      --shadow: rgba(0,0,0,0.3);
      --code-bg: #0f172a;
      --status-ok: #22c55e;
      --status-err: #ef4444;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  header h1 span { color: var(--accent); }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--status-err);
    transition: background 0.3s;
  }
  .status-dot.connected { background: var(--status-ok); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bg);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
  }
  .msg.bot code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .msg.bot pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 6px 0;
    font-size: 13px;
  }
  .msg.bot pre code {
    background: none;
    padding: 0;
  }
  .msg.bot ul, .msg.bot ol {
    padding-left: 20px;
    margin: 4px 0;
  }
  .msg.bot strong { font-weight: 600; }
  .msg.bot em { font-style: italic; }
  .typing {
    align-self: flex-start;
    padding: 10px 14px;
    background: var(--bot-bg);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: none;
    gap: 4px;
    animation: fadeIn 0.2s ease;
  }
  .typing.visible { display: flex; }
  .typing span {
    width: 7px; height: 7px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.16s; }
  .typing span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  .input-bar {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--bg-input);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-secondary); }
  #send {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  #send:hover { opacity: 0.85; }
  #send:disabled { opacity: 0.4; cursor: default; }
  #send svg { width: 18px; height: 18px; }
  .welcome {
    text-align: center;
    color: var(--text-secondary);
    padding: 40px 20px;
    font-size: 14px;
    line-height: 1.6;
  }
  .welcome h2 {
    font-size: 20px;
    color: var(--text);
    margin-bottom: 8px;
  }
  @media (max-width: 600px) {
    .msg { max-width: 88%; }
    header { padding: 12px 16px; }
    #messages { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <h1><span>AmanClaw</span> &middot; {{TENANT_NAME}}</h1>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Connecting&hellip;</span>
  </div>
</header>
<div id="messages">
  <div class="welcome">
    <h2>Welcome</h2>
    <p>Send a message to start chatting with {{TENANT_NAME}}.</p>
  </div>
</div>
<div class="typing" id="typing"><span></span><span></span><span></span></div>
<div class="input-bar">
  <input id="input" type="text" placeholder="Type a message&hellip;" autocomplete="off" />
  <button id="send" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>
<script>
(function(){
  var SLUG = '{{TENANT_SLUG}}';
  var API_URL = '/t/' + SLUG + '/api/chat';
  var messagesEl = document.getElementById('messages');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var typingEl = document.getElementById('typing');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var ready = false;

  function setStatus(ok, text) {
    if (ok) { statusDot.classList.add('connected'); }
    else { statusDot.classList.remove('connected'); }
    statusText.textContent = text;
    ready = ok;
    sendBtn.disabled = !ok || !inputEl.value.trim();
  }

  function checkConnection() {
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{"text":""}'
    }).then(function(r) {
      if (r.ok || r.status === 400) {
        setStatus(true, 'Connected');
      } else {
        setStatus(false, 'Disconnected');
        setTimeout(checkConnection, 5000);
      }
    })['catch'](function() {
      setStatus(false, 'Disconnected');
      setTimeout(checkConnection, 5000);
    });
  }

  /* Safe DOM-based markdown renderer — no innerHTML, no XSS risk. */
  function renderBotMessage(text) {
    var container = document.createDocumentFragment();
    var parts = text.split(/```(?:\w*)\n?/);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var pre = document.createElement('pre');
        var code = document.createElement('code');
        code.textContent = parts[i].replace(/\n$/, '');
        pre.appendChild(code);
        container.appendChild(pre);
      } else {
        var lines = parts[i].split('\n');
        for (var j = 0; j < lines.length; j++) {
          if (j > 0) container.appendChild(document.createElement('br'));
          appendFormattedLine(container, lines[j]);
        }
      }
    }
    return container;
  }

  function appendFormattedLine(parent, line) {
    var ulMatch = line.match(/^- (.+)/);
    var olMatch = line.match(/^\d+\. (.+)/);
    if (ulMatch) {
      var li = document.createElement('span');
      li.textContent = '\u2022 ' + ulMatch[1];
      parent.appendChild(li);
      return;
    }
    if (olMatch) {
      var sp = document.createElement('span');
      sp.textContent = line;
      parent.appendChild(sp);
      return;
    }
    var regex = /(\*\*(.+?)\*\*|\*(.+?)\*|`([^`]+)`)/g;
    var lastIdx = 0;
    var match;
    while ((match = regex['exec'](line)) !== null) {
      if (match.index > lastIdx) {
        parent.appendChild(document.createTextNode(line.slice(lastIdx, match.index)));
      }
      if (match[2]) {
        var b = document.createElement('strong');
        b.textContent = match[2];
        parent.appendChild(b);
      } else if (match[3]) {
        var em = document.createElement('em');
        em.textContent = match[3];
        parent.appendChild(em);
      } else if (match[4]) {
        var c = document.createElement('code');
        c.textContent = match[4];
        parent.appendChild(c);
      }
      lastIdx = regex.lastIndex;
    }
    if (lastIdx < line.length) {
      parent.appendChild(document.createTextNode(line.slice(lastIdx)));
    }
  }

  function addMessage(text, role) {
    var welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'bot') {
      div.appendChild(renderBotMessage(text));
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function send() {
    var text = inputEl.value.trim();
    if (!text || !ready) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    addMessage(text, 'user');
    typingEl.classList.add('visible');
    messagesEl.scrollTop = messagesEl.scrollHeight;

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    }).then(function(res) {
      typingEl.classList.remove('visible');
      if (res.ok) {
        return res.json().then(function(data) {
          addMessage(data.text || 'No response.', 'bot');
        });
      } else {
        addMessage('Error: could not reach the bot.', 'bot');
        setStatus(false, 'Disconnected');
        setTimeout(checkConnection, 3000);
      }
    })['catch'](function() {
      typingEl.classList.remove('visible');
      addMessage('Connection lost. Reconnecting\u2026', 'bot');
      setStatus(false, 'Disconnected');
      setTimeout(checkConnection, 3000);
    });
  }

  inputEl.addEventListener('input', function() {
    sendBtn.disabled = !ready || !inputEl.value.trim();
  });
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  checkConnection();
})();
</script>
</body>
</html>
