[package]
name = "amanclaw-skill-quran"
version = "0.1.0"
edition = "2024"

[dependencies]
amanclaw-traits = { path = "../../crates/amanclaw-traits" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt"] }
urlencoding = "2"
