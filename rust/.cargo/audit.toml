    "RUSTSEC-2026-0020",
    # wasmtime: wasi:http/types.fields panic — requires major version bump
    "RUSTSEC-2026-0021",
    # wasmtime: fd_renumber panic — requires major version bump
    "RUSTSEC-2025-0046",
    # wasmtime: f64.copysign segfault — requires major version bump
    "RUSTSEC-2026-0006",
    # wasmtime: shared linear memory unsoundness — requires major version bump
    "RUSTSEC-2025-0118",
]
