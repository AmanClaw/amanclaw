[workspace]
resolver = "2"
members = [
    "crates/amanclaw-cli",
    "crates/amanclaw-core",
    "crates/amanclaw-traits",
    "crates/amanclaw-security",
    "crates/amanclaw-memory",
    "crates/amanclaw-llm",
    "crates/amanclaw-wasm-runtime",
    "crates/amanclaw-plugin-sdk",
    "plugins/skill-sysinfo",
    "plugins/skill-websearch",
    "plugins/skill-shell",
    "plugins/channel-telegram",
    "plugins/channel-discord",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
