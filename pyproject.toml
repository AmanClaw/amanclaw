[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amanclaw"
version = "0.1.0"
description = "Smart, secure personal AI assistant on Telegram"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==21.7",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "aiohttp>=3.9,<4",
    "psutil>=5.9,<7",
    "python-dotenv>=1.0,<2",
    "mcp>=1.0",
    "amanclaw-learning @ file:packages/amanclaw-learning",
    "amanclaw-security @ file:packages/amanclaw-security",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
pdf = ["pypdf>=4.0,<5"]
discord = ["discord.py>=2.3"]
slack = ["slack-bolt>=1.18", "slack-sdk>=3.27"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pypdf>=4.0,<5",
]

[project.scripts]
amanclaw = "amanclaw.__main__:main"

[tool.setuptools.packages.find]
include = ["amanclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
