[workspace]
resolver = "2"
members = [
    # Library crates
    "crates/amanclaw-traits",
    "crates/amanclaw-core",
    "crates/amanclaw-memory",
    "crates/amanclaw-llm",
    "crates/amanclaw-security",
    "crates/amanclaw-mcp",
    "crates/amanclaw-api",
    "crates/amanclaw-gateway",
    "crates/amanclaw-islamic-db",
    "crates/amanclaw-registry",
    "crates/amanclaw-skill-index",
    "crates/amanclaw-plugin-sdk",
    "crates/amanclaw-wasm-runtime",
    "crates/amanclaw-script-runtime",
    "crates/amanclaw-prayer-times",
    # Apps
    "apps/cli",
    "apps/cloud",
    "apps/desktop/src-tauri",
    # Skills
    "skills/skill-solat",
    "skills/skill-quran",
    "skills/skill-qiblat",
    "skills/skill-hijri",
    "skills/skill-doa",
    "skills/skill-hadith-rs",
    "skills/skill-fiqh",
    "skills/skill-shell",
    "skills/skill-sysinfo",
    "skills/skill-echo-wasm",
    # Channels
    "channels/channel-telegram",
    "channels/channel-discord",
    "channels/channel-whatsapp",
    "channels/channel-whatsapp-web",
    "channels/channel-slack",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AmanClaw/amanclaw"
homepage = "https://github.com/AmanClaw/amanclaw"
keywords = ["ai", "assistant", "chatbot", "plugin", "islamic"]
categories = ["command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
