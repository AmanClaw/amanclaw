apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: amanclaw-cloud
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache sqlite
                  BACKUP_DIR=/backups/$(date +%Y%m%d)
                  mkdir -p $BACKUP_DIR
                  cp /data/cloud.db $BACKUP_DIR/
                  for dir in /data/tenants/*/data; do
                    tenant=$(basename $(dirname $dir))
                    mkdir -p $BACKUP_DIR/$tenant
                    cp $dir/*.db $BACKUP_DIR/$tenant/ 2>/dev/null || true
                  done
                  # Keep last 7 days
                  find /backups -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
                  echo "Backup complete: $BACKUP_DIR"
              volumeMounts:
                - name: tenant-data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: tenant-data
              persistentVolumeClaim:
                claimName: tenant-data-pvc
            - name: backups
              hostPath:
                path: /opt/amanclaw-backups
                type: DirectoryOrCreate
