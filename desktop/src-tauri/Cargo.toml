[package]
name = "amanclaw-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
serde_yaml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
chrono = "0.4"
dotenvy = "0.15"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

uuid = { version = "1", features = ["v4"] }

# AmanClaw engine
amanclaw-core = { path = "../../rust/crates/amanclaw-core" }
amanclaw-traits = { path = "../../rust/crates/amanclaw-traits" }
amanclaw-api = { path = "../../rust/crates/amanclaw-api" }
amanclaw-security = { path = "../../rust/crates/amanclaw-security" }
amanclaw-registry = { path = "../../rust/crates/amanclaw-registry" }
amanclaw-skill-index = { path = "../../rust/crates/amanclaw-skill-index" }
amanclaw-skill-doa = { path = "../../rust/plugins/skill-doa" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
