# AmanClaw — Configuration
# Copy to config.yaml and customize:  cp config.example.yaml config.yaml
#
# SECRETS (bot token, API keys) go in .env, NOT here.
# See .env.example for details.

# LLM settings — requires an OpenAI-compatible API server
# Works with: vLLM, Ollama, LM Studio, LocalAI, text-generation-webui, etc.
llm:
  base_url: "http://localhost:8001/v1"   # or set LLM_BASE_URL env var
  model: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  # api_key: loaded from LLM_API_KEY env var
  max_tokens: 4096
  temperature: 0.7

# Admin user IDs — can approve/block users and always have access.
# Use /myid command to find your Telegram ID.
# For WhatsApp, use the phone number (e.g. "60123456789").
admin_users:
  telegram: []       # e.g. [123456789]
  whatsapp: []       # e.g. ["60123456789"]

rate_limit_per_minute: 20

memory_db: memory.db   # or set MEMORY_DB_PATH env var

# Skill settings
skills:
  shell_allowed_commands:
    - ls
    - cat
    - head
    - tail
    - wc
    - grep
    - find
    - which
    - df
    - du
    - free
    - uptime
    - date
    - ps
    - whoami
    - hostname
    - pwd
    - tree
  shell_working_dir: "~"
  workspace_dir: "~/amanclaw-workspace"
  skill_timeout_seconds: 30

# Learning Engine
learning:
  enabled: true
  proactive_checkins: true
  checkin_day: 6           # 0=Monday, 6=Sunday
  checkin_hour: 10
  checkin_min_age_days: 14  # Only check facts older than this
  document_max_chars: 50000 # Max chars to ingest per document

# WhatsApp (optional — requires the Baileys bridge)
# See bridge/whatsapp/README.md for setup instructions.
# whatsapp:
#   enabled: false
#   bridge_url: "http://localhost:3001"  # or set WA_BRIDGE_URL env var
#   port: 3002                           # callback server port
#   listen: "0.0.0.0"
#   ignore_groups: true                  # ignore group messages

# Optional environment variables for extra skills:
#   BRAVE_API_KEY — enables the web_search skill (get one at https://api.search.brave.com/)

# Webhook mode (optional — uses polling by default)
# Requires HTTPS. Use with a reverse proxy (nginx, caddy, etc.)
# webhook:
#   enabled: false
#   url: "https://your-domain.com"
#   listen: "0.0.0.0"
#   port: 8443
#   # secret_token: loaded from WEBHOOK_SECRET env var
