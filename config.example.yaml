# AmanClaw — Configuration
# Copy to config.yaml and customize:  cp config.example.yaml config.yaml
#
# SECRETS (bot token, API keys) go in .env, NOT here.
# See .env.example for details.

# LLM settings — requires an OpenAI-compatible API server
# Works with: vLLM, Ollama, LM Studio, LocalAI, text-generation-webui, etc.
llm:
  base_url: "http://localhost:8001/v1"   # or set LLM_BASE_URL env var
  model: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  # api_key: loaded from LLM_API_KEY env var
  max_tokens: 4096
  temperature: 0.7

# Admin user IDs — can approve/block users and always have access.
# Use /myid command to find your Telegram ID.
# For WhatsApp Web, use the phone number without '+' (e.g. "60123456789").
admin_users:
  telegram: []         # e.g. [123456789]
  whatsapp-web: []     # e.g. ["60123456789"]

rate_limit_per_minute: 20

memory_db: data/memory.db   # or set MEMORY_DB_PATH env var

# Skill settings
skills:
  shell_allowed_commands:
    - ls
    - cat
    - head
    - tail
    - wc
    - grep
    - find
    - which
    - df
    - du
    - free
    - uptime
    - date
    - ps
    - whoami
    - hostname
    - pwd
    - tree
  shell_working_dir: "~"
  workspace_dir: "~/amanclaw-workspace"
  skill_timeout_seconds: 30

# Learning Engine
learning:
  enabled: true
  proactive_checkins: true
  checkin_day: 6           # 0=Monday, 6=Sunday
  checkin_hour: 10
  checkin_min_age_days: 14  # Only check facts older than this
  document_max_chars: 50000 # Max chars to ingest per document

# --- WhatsApp Web (optional — via wa-bridge) ---
# Uses whatsapp-web.js with a WAHA-compatible API bridge.
# See wa-bridge/README.md for setup instructions.
# Env vars needed in .env:
#   WAHA_API_URL=http://127.0.0.1:3000
#   WAHA_SESSION=default
#   WAHA_WEBHOOK_PORT=8081

# --- Discord (optional) ---
discord:
  enabled: false
  # token loaded from DISCORD_BOT_TOKEN env var
  allowed_channels: []
  command_prefix: "!"

# --- Slack (optional) ---
slack:
  enabled: false
  # tokens loaded from SLACK_BOT_TOKEN and SLACK_APP_TOKEN env vars
  socket_mode: true
  allowed_channels: []

# --- Web Dashboard (optional) ---
# Set ADMIN_PASSWORD in .env to enable the web dashboard.
# Access at http://your-host:8443/admin
# API_PORT defaults to 8443.

# --- Security (optional overrides) ---
security:
  injection_rules: "default"     # "default" or "owasp_agentic"
  sanitize_output: true


# Webhook mode (optional — uses polling by default)
# Requires HTTPS. Use with a reverse proxy (nginx, caddy, etc.)
# webhook:
#   enabled: false
#   url: "https://your-domain.com"
#   listen: "0.0.0.0"
#   port: 8443
#   # secret_token: loaded from WEBHOOK_SECRET env var

# --- Islamic Python Plugins (optional) ---
# These plugins are loaded via the script runtime.
# Set env vars in .env for any that need API keys.
script_plugins:
  hadith:
    command: "python3"
    args: ["plugins/skill_hadith.py"]
    env:
      SUNNAH_API_KEY: "${SUNNAH_API_KEY}"
  halal:
    command: "python3"
    args: ["plugins/skill_halal.py"]
    env: {}
  zakat:
    command: "python3"
    args: ["plugins/skill_zakat.py"]
    env: {}
  masjid:
    command: "python3"
    args: ["plugins/skill_masjid.py"]
    env:
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY}"
  khutbah:
    command: "python3"
    args: ["plugins/skill_khutbah.py"]
    env: {}
  jakim:
    command: "python3"
    args: ["plugins/skill_jakim.py"]
    env: {}

